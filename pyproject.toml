[tool.black]
line-length = 79
target-version = ["py310", "py311", "py312", "py313", "py314"]


[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = [
    "tests",
]

# =============================================================================
# PACKAGING
# =============================================================================

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-criteria"
version = "0.10.0.dev0"
authors = [{name = "Juan B Cabral & QuatroPe", email = "jbcabral@unc.edu.ar"}]
readme = "README.md"
license = {file = "LICENSE.txt"}
description = "Scikit-Criteria is a collections of algorithms, methods and techniques for multiple-criteria decision analysis."
keywords = [
    "muticriteria",
    "mcda",
    "mcdm",
    "weightedsum",
    "weightedproduct",
    "simus",
    "topsis",
    "moora",
    "electre",
    "probid",
    "critic",
    "entropy",
    "dominance",
    "packaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]
urls = { Homepage = "https://scikit-criteria.quatrope.org/", Repository = "https://github.com/quatrope/scikit-criteria" }
# Dependencies are pinned to the first minor version and limited to the next major version
dependencies = [
    "numpy>=2.2.0,<3",
    "networkx>=3.4.0,<4",
    "pandas>=2.3.0,<3",
    "scipy>=1.15.0,<2",
    "jinja2>=3.1.0,<4",
    "custom_inherit>=2.4.0,<3",
    "seaborn>=0.13,<0.14",
    "pulp>=3.3.0,<4",
    "Deprecated>=1.3.0,<2",
    "scikit-learn>=1.7.0,<2",
    "matplotlib>=3.10.0,<4",
    "methodtools>=0.4,<1",
    "pyyaml>=6.0.0,<7",
    "igraph>=1.0.0,<2"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skcriteria", "skcriteria.*"]
namespaces = false
